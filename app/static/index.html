<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talkAI</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e0da;
    --user: #2f6fed; --user-text: #fff; --ai: #ecebe6; --accent: #2f6fed; --danger: #d6453d; --ok: #2e9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1d1d20; --text: #ececee; --muted: #9a9aa0; --line: #2e2e33;
            --user: #3b76ef; --ai: #2a2a2f; --accent: #5a8cf2; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
         height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input[type=text], button { font: inherit; color: var(--text); }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.ok::before { background: var(--ok); }
  #status.err::before { background: var(--danger); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  #log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .user.partial { opacity: .6; }
  .ai { align-self: flex-start; background: var(--ai); border-bottom-left-radius: 4px; }
  .ai.cut::after { content: "（中断）"; color: var(--muted); font-size: 12px; margin-left: 4px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  .sys.err { color: var(--danger); }
  footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  #mic { flex: none; width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
         background: var(--accent); color: #fff; display: grid; place-items: center; }
  #mic.on { background: var(--danger); animation: pulse 1.6s infinite; }
  #mic svg { width: 24px; height: 24px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 25%, transparent); } }
  #text { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; white-space: nowrap; }
  #hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>talkAI</h1>
  <label>モデル <select id="model"></select></label>
  <label>声 <select id="voice"></select></label>
  <label title="ヘッドホン使用時のみ推奨。スピーカーだとAI自身の声で止まることがあります">
    <input type="checkbox" id="bargein"> 話しかけて割り込む
  </label>
  <span id="status">接続中…</span>
</header>
<main><div id="log"></div></main>
<footer>
  <form class="bar" id="form">
    <button type="button" id="mic" title="マイク開始/停止">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <input type="text" id="text" placeholder="文字でも話しかけられます" autocomplete="off">
    <button type="button" class="btn" id="stop">止める</button>
    <button type="button" class="btn" id="reset">リセット</button>
  </form>
  <div id="hint">マイクボタンを押して話しかけてください</div>
</footer>

<script type="module">
const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status"), hint = $("hint");

let ws;
let ctx;                 // 再生とマイク取り込みで共用する AudioContext
let mic = null;          // { stream, node }
let turnActive = false;  // サーバが返答を生成・合成している間
let currentTurn = 0;
let dropTurn = 0;        // この番号以下のターンの音声は捨てる（中断済み）
let nextTime = 0;
const sources = new Set();
let playChain = Promise.resolve();
const userItems = new Map();  // item_id -> 発話中の吹き出し
const aiBubbles = new Map();  // turn -> 返答の吹き出し

// ---- 表示 ----
function bubble(cls, text = "") {
  const el = document.createElement("div");
  el.className = `msg ${cls}`;
  el.textContent = text;
  log.append(el);
  log.parentElement.scrollTop = log.parentElement.scrollHeight;
  return el;
}
const scroll = () => { log.parentElement.scrollTop = log.parentElement.scrollHeight; };
function setStatus(text, cls = "") { statusEl.textContent = text; statusEl.className = cls; }

// ---- サーバ接続 ----
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { setStatus("接続済み", "ok"); sendConfig(); };
  ws.onclose = () => {
    setStatus("再接続中…", "err");
    endTurn();
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) { playChain = playChain.then(() => play(e.data)); return; }
    onEvent(JSON.parse(e.data));
  };
}
const send = (obj) => ws && ws.readyState === 1 && ws.send(JSON.stringify(obj));
const sendConfig = () => send({ type: "config", model: $("model").value, voice: $("voice").value });

function onEvent(ev) {
  switch (ev.type) {
    case "status":
      setStatus(ev.text, ev.text === "準備完了" ? "ok" : "");
      break;
    case "speech_started":
      if ($("bargein").checked && (turnActive || sources.size)) interrupt();
      hint.textContent = "聞いています…";
      break;
    case "user_delta": {
      let el = userItems.get(ev.item);
      if (!el) { el = bubble("user partial"); userItems.set(ev.item, el); }
      el.textContent += ev.text;
      scroll();
      break;
    }
    case "user_final": {
      const el = userItems.get(ev.item);
      userItems.delete(ev.item);
      if (!ev.text) { el?.remove(); hint.textContent = ""; break; }
      if (el) { el.textContent = ev.text; el.classList.remove("partial"); } else bubble("user", ev.text);
      break;
    }
    case "turn_start":
      if (ev.user) bubble("user", ev.user);
      // 前のターンが残っていれば中断扱いにする
      if (turnActive || sources.size) stopPlayback();
      currentTurn = ev.turn;
      turnActive = true;
      aiBubbles.set(ev.turn, bubble("ai"));
      hint.textContent = "考えています…";
      updateMute();
      break;
    case "assistant_delta": {
      const el = aiBubbles.get(ev.turn);
      if (el && ev.turn > dropTurn) { el.textContent += ev.text; scroll(); }
      break;
    }
    case "turn_end":
      if (ev.turn === currentTurn) endTurn();
      break;
    case "error":
      bubble("sys err", ev.text);
      if (!ev.turn || ev.turn === currentTurn) endTurn();
      break;
  }
}

function endTurn() {
  turnActive = false;
  updateMute();
}

// ---- 再生 ----
function ensureContext() {
  ctx ??= new AudioContext();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

async function play(buf) {
  const turn = new DataView(buf).getUint32(0, true);
  if (turn <= dropTurn || !ctx) return;
  const audio = await ctx.decodeAudioData(buf.slice(4));
  if (turn <= dropTurn) return;
  const src = ctx.createBufferSource();
  src.buffer = audio;
  src.connect(ctx.destination);
  const t = Math.max(ctx.currentTime + 0.05, nextTime);
  src.start(t);
  nextTime = t + audio.duration;
  sources.add(src);
  hint.textContent = "話しています…";
  updateMute();
  src.onended = () => {
    sources.delete(src);
    if (!sources.size && !turnActive) hint.textContent = mic ? "どうぞ話しかけてください" : "";
    updateMute();
  };
}

function stopPlayback() {
  dropTurn = currentTurn;
  for (const s of sources) { s.onended = null; s.stop(); }
  sources.clear();
  nextTime = 0;
  aiBubbles.get(currentTurn)?.classList.add("cut");
}

function interrupt() {
  if (!turnActive && !sources.size) return;
  stopPlayback();
  send({ type: "interrupt" });
  endTurn();
  hint.textContent = mic ? "どうぞ話しかけてください" : "";
}

// ---- マイク ----
let unmuteTimer;
function updateMute() {
  if (!mic) return;
  // 割り込み無効時は AI が返答している間マイクを無音にする（スピーカーの声を拾わないため）
  const muted = !$("bargein").checked && (turnActive || sources.size > 0);
  clearTimeout(unmuteTimer);
  if (muted) mic.node.port.postMessage({ muted: true });
  else unmuteTimer = setTimeout(() => mic?.node.port.postMessage({ muted: false }), 300);
}

async function startMic() {
  ensureContext();
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  await ctx.audioWorklet.addModule("/static/mic-worklet.js");
  const node = new AudioWorkletNode(ctx, "mic-capture", { numberOfInputs: 1, numberOfOutputs: 0 });
  node.port.onmessage = (e) => { if (ws?.readyState === 1) ws.send(e.data); };
  ctx.createMediaStreamSource(stream).connect(node);
  mic = { stream, node };
  updateMute();
  $("mic").classList.add("on");
  hint.textContent = "どうぞ話しかけてください";
}

function stopMic() {
  mic.stream.getTracks().forEach((t) => t.stop());
  mic.node.disconnect();
  mic = null;
  $("mic").classList.remove("on");
  hint.textContent = "マイクボタンを押して話しかけてください";
}

$("mic").onclick = async () => {
  try { mic ? stopMic() : await startMic(); }
  catch (e) { bubble("sys err", `マイクを使えません: ${e.message}`); }
};
$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  ensureContext();
  send({ type: "text", text });
  $("text").value = "";
};
$("stop").onclick = interrupt;
$("reset").onclick = () => {
  interrupt();
  send({ type: "reset" });
  log.replaceChildren();
  bubble("sys", "会話をリセットしました");
};
$("model").onchange = sendConfig;
$("voice").onchange = sendConfig;
$("bargein").onchange = updateMute;

// ---- 初期化 ----
const cfg = await (await fetch("/api/config")).json();
for (const [sel, list, cur] of [[$("model"), cfg.models, cfg.model], [$("voice"), cfg.voices, cfg.voice]]) {
  for (const v of list) sel.add(new Option(v, v, false, v === cur));
}
connect();
</script>
</body>
</html>
